<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>สินค้าทั้งหมด (SKUs) — BodyBright</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  
  <nav class="navbar">
    <div class="nav-container">
      <a href="index.html" class="logo">BodyBright</a>
      <ul class="nav-links">
        <li><a href="index.html" >หน้าแรก</a></li>
<li><a href="product.html" class="active">สินค้า (SKUs)</a></li>
<li><a href="order.html" >สั่งซื้อ <span class="cart-badge">0</span></a></li>
<li><a href="warehouse/pick-pack.html" >แพ็ค & จ่าหน้าพัสดุ</a></li>
<li><a href="admin.html" >หลังบ้าน (Admin)</a></li>

      </ul>
    </div>
  </nav>

  <main class="container">
    <h1 class="section-title">สินค้า BodyBright ทั้งหมด (10 SKUs)</h1>
    <p class="section-subtitle">เลือกช้อปสบู่ก้อนขนาดเดี่ยว หรือเซตสุดคุ้มได้ตามต้องการ</p>

    <div class="filter-bar">
      <button class="filter-btn active" data-filter="ALL">ทั้งหมด (10 SKUs)</button>
      <button class="filter-btn" data-filter="Sport">กลิ่น Sport</button>
      <button class="filter-btn" data-filter="Peach">กลิ่น Peach</button>
      <button class="filter-btn" data-filter="Mix">เซตคละกลิ่นสุดคุ้ม</button>
    </div>

    <div id="products-grid" class="products-grid"></div>
  </main>
  
  <footer>
    <p>© 2026 BodyBright Soap Thailand. ปลุกความสดชื่น เผยผิวไบรท์ใสอย่างมั่นใจในทุกวันของคุณ</p>
  </footer>

  <script src="js/app.js"></script>
  <script>
    let allProducts = [];
    function renderProducts(filter = 'ALL') {
      const filtered = filter === 'ALL' ? allProducts : allProducts.filter(p => p.scent === filter);
      document.getElementById('products-grid').innerHTML = filtered.map(p => `
        <div class="product-card">
          <div class="product-img-wrap">
            <span class="product-badge">${p.tag}</span>
            <span class="sku-pill">${p.sku}</span>
            <img src="${p.image}" alt="${p.name}">
          </div>
          <div class="product-info">
            <span class="scent-tag ${p.scent === 'Sport' ? 'tag-sport' : (p.scent === 'Peach' ? 'tag-peach' : 'tag-mix')}" style="font-size:0.72rem; margin-bottom:0.4rem;">
              ${p.scent} • ${p.size}
            </span>
            <h3 class="product-title">${p.name}</h3>
            <p class="product-desc">${p.description}</p>
            <div class="product-footer">
              <span class="product-price">฿${p.price}</span>
              <button class="btn btn-primary btn-sm" onclick='addToCart(${JSON.stringify(p)})'>+ ใส่ตะกร้า</button>
            </div>
          </div>
        </div>
      `).join('');
    }

    document.addEventListener('DOMContentLoaded', async () => {
      allProducts = await loadProducts();
      const initialFilter = new URLSearchParams(window.location.search).get('scent') || 'ALL';
      document.querySelectorAll('.filter-btn').forEach(btn => {
        if (btn.dataset.filter === initialFilter) {
          document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
        }
        btn.addEventListener('click', () => {
          document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
          renderProducts(btn.dataset.filter);
        });
      });
      renderProducts(initialFilter);
    });
  </script>
</body>
</html>
